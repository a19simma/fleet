apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-bootstrap-password
  namespace: fleet-server
spec:
  refreshInterval: "0s"
  refreshPolicy: CreatedOnce
  target:
    name: fleet-bootstrap-password
    creationPolicy: Orphan
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: fleet-bootstrap-password
