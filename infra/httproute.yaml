apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fleet-server
  namespace: fleet-server
spec:
  parentRefs:
    - name: fleet
      sectionName: https
  hostnames:
    - fleet.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      timeouts:
        request: 0s
      backendRefs:
        - name: fleet-server
          port: 7070
