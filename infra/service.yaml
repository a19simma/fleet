apiVersion: v1
kind: Service
metadata:
  name: fleet-server
  namespace: fleet-server
spec:
  type: ClusterIP
  selector:
    app: fleet-server
  ports:
    - name: grpc
      port: 7070
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
    - name: health
      port: 7072
      targetPort: health
