[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/a19simma/fleet"
authors = ["Simon Malm"]

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
fleet-core = { path = "crates/fleet-core" }
fleet-proto = { path = "crates/fleet-proto" }
prost = "0.14"
protoc-bin-vendored = "3.3.0"
rustix = { version = "1.1.5", features = ["process"] }
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "transport", "router", "tls-ring", "tls-webpki-roots"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util", "io-std"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "tracing-log"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
undocumented_unsafe_blocks = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
mem_forget = "deny"
indexing_slicing = "warn"
unwrap_in_result = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

[profile.dist]
inherits = "release"
lto = "thin"
