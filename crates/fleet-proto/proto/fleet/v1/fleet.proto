syntax = "proto3";

package fleet.v1;

service FleetIngest {
  rpc PushEvents(PushEventsRequest) returns (PushEventsReply);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
}

service FleetQuery {
  rpc ListFleet(ListFleetRequest) returns (ListFleetReply);
}

service FleetJobs {
  rpc SubmitJob(SubmitJobRequest) returns (Job);
  rpc GetJob(GetJobRequest) returns (Job);
  rpc ListJobs(ListJobsRequest) returns (ListJobsReply);
  rpc CancelJob(CancelJobRequest) returns (Job);
  rpc ReadTranscript(ReadTranscriptRequest) returns (ReadTranscriptReply);
  rpc ReadJobEvents(ReadJobEventsRequest) returns (ReadJobEventsReply);
  rpc GetStats(GetStatsRequest) returns (GetStatsReply);
}

service FleetProfiles {
  rpc CreateProfile(CreateProfileRequest) returns (ProfileVersion);
  rpc GetProfile(GetProfileRequest) returns (ProfileVersion);
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesReply);
}

service FleetJudge {
  rpc SubmitJudge(SubmitJudgeRequest) returns (Job);
}

service FleetBatches {
  rpc SubmitBatch(SubmitBatchRequest) returns (SubmitBatchReply);
  rpc GetBatch(GetBatchRequest) returns (GetBatchReply);
}

service FleetCredentials {
  rpc PutCredential(PutCredentialRequest) returns (CredentialInfo);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsReply);
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialReply);
  rpc VerifyCredential(VerifyCredentialRequest) returns (VerifyCredentialReply);
}

service FleetWorker {
  rpc ClaimJob(ClaimJobRequest) returns (ClaimJobReply);
  rpc ReportJob(ReportJobRequest) returns (ReportJobReply);
  rpc GetProfileBlob(GetProfileBlobRequest) returns (GetProfileBlobReply);
  rpc GetJobTranscript(GetJobTranscriptRequest) returns (GetJobTranscriptReply);
  rpc GetJobCredentials(GetJobCredentialsRequest) returns (GetJobCredentialsReply);
}

message PutCredentialRequest {
  string kind = 1;
  string shape = 2;
  string value = 3;
  optional uint64 expires_at_ms = 4;
}

message CredentialInfo {
  uint64 id = 1;
  string kind = 2;
  string shape = 3;
  string fingerprint = 4;
  optional string login = 5;
  optional uint64 expires_at_ms = 6;
}

message ListCredentialsRequest {}

message ListCredentialsReply {
  repeated CredentialInfo credentials = 1;
}

message DeleteCredentialRequest {
  uint64 id = 1;
}

message DeleteCredentialReply {}

message VerifyCredentialRequest {
  uint64 id = 1;
}

message VerifyCredentialReply {
  bool valid = 1;
  optional string login = 2;
  optional uint64 expires_at_ms = 3;
}

message GetJobCredentialsRequest {
  string job_id = 1;
  uint32 attempt = 2;
  string box = 3;
}

message JobCredential {
  string kind = 1;
  string shape = 2;
  string value = 3;
}

message GetJobCredentialsReply {
  repeated JobCredential credentials = 1;
}

message Envelope {
  string id = 1;
  uint32 schema_version = 2;
  string box = 3;
  string hostname = 4;
  string machine_id = 5;
  string boot_id = 6;
  string source = 7;
  string kind = 8;
  uint64 ts_ms = 9;
  optional string session_id = 10;
  optional string prompt_id = 11;
  optional string workdir = 12;
  optional uint64 occurred_at_ms = 13;
  string payload_json = 14;
}

message QueuedEvent {
  uint64 seq = 1;
  Envelope envelope = 2;
}

message PushEventsRequest {
  repeated QueuedEvent events = 1;
}

message PushEventsReply {
  uint64 acked_through_seq = 1;
  uint32 stored = 2;
  uint32 duplicate = 3;
  repeated Rejection rejected = 4;
}

message Rejection {
  uint64 seq = 1;
  string reason = 2;
}

message HeartbeatRequest {
  string box = 1;
  string hostname = 2;
  string machine_id = 3;
  string boot_id = 4;
  string fleetd_version = 5;
  uint64 uptime_s = 6;
  uint64 queue_pending = 7;
  uint64 queue_oldest_age_s = 8;
  optional uint64 last_ack_age_s = 9;
}

message HeartbeatReply {
  uint32 next_in_s = 1;
}

message ListFleetRequest {
  optional string box = 1;
}

message ListFleetReply {
  uint64 as_of_ms = 1;
  repeated BoxView boxes = 2;
}

message BoxView {
  string box = 1;
  string hostname = 2;
  BoxStatus status = 3;
  optional uint64 heartbeat_age_s = 4;
  string boot_id = 5;
  string fleetd_version = 6;
  uint64 queue_pending = 7;
  uint64 queue_oldest_age_s = 8;
  repeated SessionView sessions = 9;
}

enum BoxStatus {
  BOX_STATUS_UNSPECIFIED = 0;
  BOX_STATUS_UNKNOWN = 1;
  BOX_STATUS_LIVE = 2;
  BOX_STATUS_STALE = 3;
  BOX_STATUS_LOST = 4;
}

message SessionView {
  string session_id = 1;
  string kind = 2;
  SessionState state = 3;
  uint64 state_age_s = 4;
  optional string workdir = 5;
  optional string last_prompt = 6;
  optional string last_message = 7;
  uint64 last_event_age_s = 8;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_ACTIVE = 1;
  SESSION_STATE_WORKING = 2;
  SESSION_STATE_IDLE = 3;
  SESSION_STATE_STALLED = 4;
  SESSION_STATE_ENDED = 5;
  SESSION_STATE_CRASHED = 6;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_CANCELLED = 5;
  JOB_STATE_LOST = 6;
}

enum JobKind {
  JOB_KIND_UNSPECIFIED = 0;
  JOB_KIND_AGENT = 1;
  JOB_KIND_JUDGE = 2;
}

message Job {
  string job_id = 1;
  string idempotency_key = 2;
  string prompt = 3;
  string repo = 4;
  string base_ref = 5;
  bool open_pr = 6;
  JobState state = 7;
  string box = 8;
  uint32 attempt = 9;
  optional uint64 lease_expires_at_ms = 10;
  string progress = 11;
  optional int32 exit_code = 12;
  optional string branch = 13;
  optional string pr_url = 14;
  optional string error = 15;
  bool cancel_requested = 16;
  uint64 created_at_ms = 17;
  optional uint64 claimed_at_ms = 18;
  optional uint64 finished_at_ms = 19;
  string phase = 20;
  optional JobSummary summary = 21;
  optional ProfileRef profile = 22;
  optional string batch_id = 23;
  JobKind kind = 24;
  optional string target_job_id = 25;
  optional CiState ci_state = 26;
  optional uint64 ci_checked_at_ms = 27;
  optional string ci_url = 28;
  optional string parent_job_id = 29;
  uint32 ci_retry_attempt = 30;
  optional CiRetry ci_retry = 31;
  uint64 user_id = 32;
  string agent = 33;
}

enum CiRetry {
  CI_RETRY_UNSPECIFIED = 0;
  CI_RETRY_SUBMITTED = 1;
  CI_RETRY_EXHAUSTED = 2;
  CI_RETRY_DISABLED = 3;
  CI_RETRY_NO_LOG = 4;
  CI_RETRY_INELIGIBLE = 5;
}

enum CiState {
  CI_STATE_UNSPECIFIED = 0;
  CI_STATE_PENDING = 1;
  CI_STATE_SUCCESS = 2;
  CI_STATE_FAILURE = 3;
  CI_STATE_TIMEOUT = 4;
}

message JobCi {
  CiState state = 1;
  optional string url = 2;
  optional string failure_log = 3;
}

message JobVerdict {
  uint32 score = 1;
  string reason = 2;
  string judge_model = 3;
}

message GetJobTranscriptRequest {
  string job_id = 1;
  uint32 attempt = 2;
  string box = 3;
}

message GetJobTranscriptReply {
  string target_job_id = 1;
  repeated TranscriptChunk chunks = 2;
}

message ProfileRef {
  string name = 1;
  uint32 version = 2;
  string hash = 3;
}

message GetProfileBlobRequest {
  string job_id = 1;
  uint32 attempt = 2;
  string box = 3;
}

message GetProfileBlobReply {
  ProfileRef profile = 1;
  bytes content = 2;
}

message SubmitJobRequest {
  string idempotency_key = 1;
  string prompt = 2;
  string repo = 3;
  string base_ref = 4;
  bool open_pr = 5;
}

message SubmitJudgeRequest {
  string idempotency_key = 1;
  string prompt = 2;
  string target_job_id = 3;
}

message SubmitBatchRequest {
  string idempotency_key = 1;
  string prompt = 2;
  string repo = 3;
  string base_sha = 4;
  uint32 repeats = 5;
  repeated string profiles = 6;
}

message SubmitBatchReply {
  string batch_id = 1;
  repeated string job_ids = 2;
  bool created = 3;
}

message GetBatchRequest {
  string batch_id = 1;
}

message GetBatchReply {
  string batch_id = 1;
  string prompt = 2;
  string repo = 3;
  string base_sha = 4;
  uint32 repeats = 5;
  uint64 created_at_ms = 6;
  repeated Job jobs = 7;
}

message GetJobRequest {
  string job_id = 1;
}

message ListJobsRequest {
  optional JobState state = 1;
  uint32 limit = 2;
}

message ListJobsReply {
  repeated Job jobs = 1;
}

message CancelJobRequest {
  string job_id = 1;
}

message TranscriptChunk {
  uint64 seq = 1;
  uint64 ts_ms = 2;
  string text = 3;
  bool truncated = 4;
}

message ReadTranscriptRequest {
  string job_id = 1;
  uint64 after_seq = 2;
  uint32 limit = 3;
}

message ReadTranscriptReply {
  repeated TranscriptChunk chunks = 1;
  bool done = 2;
}

message ClaimJobRequest {
  string box = 1;
}

message ClaimJobReply {
  optional Job job = 1;
  uint32 lease_s = 2;
  uint32 next_in_s = 3;
}

message ReportJobRequest {
  string job_id = 1;
  uint32 attempt = 2;
  string box = 3;
  string phase = 4;
  string progress = 5;
  optional JobState terminal_state = 6;
  optional string pr_url = 7;
  optional string error = 8;
  optional int32 exit_code = 9;
  repeated TranscriptChunk chunks = 10;
  optional string branch = 11;
  repeated JobEvent events = 12;
  optional JobSummary summary = 13;
  optional JobVerdict verdict = 14;
  optional JobCi ci = 15;
}

enum JobEventKind {
  JOB_EVENT_KIND_UNSPECIFIED = 0;
  JOB_EVENT_KIND_TOOL = 1;
  JOB_EVENT_KIND_DENIAL = 2;
  JOB_EVENT_KIND_API_RETRY = 3;
  JOB_EVENT_KIND_PHASE = 4;
  JOB_EVENT_KIND_STUCK = 5;
  JOB_EVENT_KIND_FETCH = 6;
}

message JobEvent {
  uint32 seq = 1;
  uint64 ts_ms = 2;
  JobEventKind kind = 3;
  optional string tool_use_id = 4;
  optional string tool = 5;
  optional bool ok = 6;
  optional int32 exit_code = 7;
  optional uint64 dur_ms = 8;
  optional uint64 out_bytes = 9;
  optional string out_hash = 10;
  optional string cmd = 11;
  optional string detail = 12;
}

message JobSummary {
  optional uint64 turns = 1;
  optional uint64 duration_ms = 2;
  optional uint64 duration_api_ms = 3;
  optional string stop_reason = 4;
  optional string result_subtype = 5;
  optional double cost_est_usd = 6;
  optional uint64 tokens_in = 7;
  optional uint64 tokens_out = 8;
  optional uint64 tokens_cache_read = 9;
  optional uint64 tokens_cache_write = 10;
  optional uint64 tool_calls = 11;
  optional uint64 tool_errors = 12;
  optional uint64 bash_calls = 13;
  optional uint64 bash_nonzero = 14;
  optional uint64 denials = 15;
  optional uint64 api_retries = 16;
  optional uint64 first_edit_ms = 17;
  bool complete = 18;
  repeated string missing = 19;
  optional string stuck_rule = 20;
  optional uint32 stuck_at_seq = 21;
  optional uint64 stuck_at_ms = 22;
  optional string bundle_sha = 23;
  optional string claude_version = 24;
  optional string model = 25;
  optional uint64 clone_ms = 26;
  optional uint64 push_ms = 27;
  optional uint64 pr_ms = 28;
  optional uint64 queue_wait_ms = 29;
}

message ReadJobEventsRequest {
  string job_id = 1;
  optional uint32 after_seq = 2;
  uint32 limit = 3;
}

message ReadJobEventsReply {
  repeated JobEvent events = 1;
  uint32 next_seq = 2;
}

message ReportJobReply {
  uint64 lease_expires_at_ms = 1;
  bool cancel_requested = 2;
  uint64 acked_through_seq = 3;
  bool transcript_truncated = 4;
}

enum StatsGroupBy {
  STATS_GROUP_BY_NONE = 0;
  STATS_GROUP_BY_REPO = 1;
  STATS_GROUP_BY_BOX = 2;
  STATS_GROUP_BY_STATE = 3;
  STATS_GROUP_BY_DAY = 4;
  STATS_GROUP_BY_BUNDLE_SHA = 5;
  STATS_GROUP_BY_CLAUDE_VERSION = 6;
  STATS_GROUP_BY_MODEL = 7;
}

message GetStatsRequest {
  optional int64 since = 1;
  optional int64 until = 2;
  optional string repo = 3;
  optional string box = 4;
  StatsGroupBy group_by = 5;
}

message Quantiles {
  uint64 n = 1;
  double p50 = 2;
  double p95 = 3;
}

message Total {
  uint64 n = 1;
  uint64 sum = 2;
}

message CostStats {
  uint64 n = 1;
  double sum = 2;
  double p50 = 3;
  double p95 = 4;
}

message StuckOutcomes {
  uint64 jobs = 1;
  uint64 succeeded = 2;
  uint64 failed = 3;
  uint64 other_terminal = 4;
}

message StuckRuleStats {
  string rule = 1;
  StuckOutcomes outcomes = 2;
}

message StatsGroup {
  string key = 1;
  uint64 jobs = 2;
  uint64 succeeded = 3;
  uint64 failed = 4;
  uint64 timed_out = 5;
  uint64 cancelled = 6;
  uint64 lost = 7;
  uint64 other = 8;
  uint64 with_summary = 9;
  uint64 complete = 10;
  optional Quantiles duration_ms = 11;
  optional Quantiles turns = 12;
  optional CostStats cost_est_usd = 13;
  optional Total tokens_in = 14;
  optional Total tokens_out = 15;
  optional Total tokens_cache_read = 16;
  optional Total tokens_cache_write = 17;
  optional Total tool_calls = 18;
  optional Total tool_errors = 19;
  optional Total bash_calls = 20;
  optional Total bash_nonzero = 21;
  optional Total denials = 22;
  optional Total api_retries = 23;
  optional Quantiles first_edit_ms = 24;
  uint64 stuck_jobs = 25;
  bool unknown = 26;
  repeated StuckRuleStats stuck_rules = 27;
  optional StuckOutcomes clean = 28;
  optional Quantiles clone_ms = 29;
  optional Quantiles push_ms = 30;
  optional Quantiles pr_ms = 31;
  optional Quantiles queue_wait_ms = 32;
  optional VerdictStats verdict = 33;
}

message VerdictStats {
  uint64 n = 1;
  double mean = 2;
  double p50 = 3;
  double p95 = 4;
  bool model_graded = 5;
}

message CreateProfileRequest {
  string name = 1;
  string content_json = 2;
}

message GetProfileRequest {
  string name = 1;
  optional uint32 version = 2;
}

message ProfileVersion {
  string name = 1;
  uint32 version = 2;
  string hash = 3;
  string content_json = 4;
  bool created = 5;
}

message ListProfilesRequest {
  uint32 limit = 1;
  optional string after_name = 2;
}

message ProfileSummary {
  string name = 1;
  uint32 latest_version = 2;
  string hash = 3;
}

message ListProfilesReply {
  repeated ProfileSummary profiles = 1;
}

message GetStatsReply {
  repeated StatsGroup groups = 1;
  bool truncated = 2;
  int64 since = 3;
  int64 until = 4;
  bool clamped = 5;
}
