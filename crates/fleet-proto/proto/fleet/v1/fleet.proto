syntax = "proto3";

package fleet.v1;

service FleetIngest {
  rpc PushEvents(PushEventsRequest) returns (PushEventsReply);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
}

service FleetQuery {
  rpc ListFleet(ListFleetRequest) returns (ListFleetReply);
}

service FleetJobs {
  rpc SubmitJob(SubmitJobRequest) returns (Job);
  rpc GetJob(GetJobRequest) returns (Job);
  rpc ListJobs(ListJobsRequest) returns (ListJobsReply);
  rpc CancelJob(CancelJobRequest) returns (Job);
  rpc ReadTranscript(ReadTranscriptRequest) returns (ReadTranscriptReply);
}

service FleetWorker {
  rpc ClaimJob(ClaimJobRequest) returns (ClaimJobReply);
  rpc ReportJob(ReportJobRequest) returns (ReportJobReply);
}

message Envelope {
  string id = 1;
  uint32 schema_version = 2;
  string box = 3;
  string hostname = 4;
  string machine_id = 5;
  string boot_id = 6;
  string source = 7;
  string kind = 8;
  uint64 ts_ms = 9;
  optional string session_id = 10;
  optional string prompt_id = 11;
  optional string workdir = 12;
  optional uint64 occurred_at_ms = 13;
  string payload_json = 14;
}

message QueuedEvent {
  uint64 seq = 1;
  Envelope envelope = 2;
}

message PushEventsRequest {
  repeated QueuedEvent events = 1;
}

message PushEventsReply {
  uint64 acked_through_seq = 1;
  uint32 stored = 2;
  uint32 duplicate = 3;
  repeated Rejection rejected = 4;
}

message Rejection {
  uint64 seq = 1;
  string reason = 2;
}

message HeartbeatRequest {
  string box = 1;
  string hostname = 2;
  string machine_id = 3;
  string boot_id = 4;
  string fleetd_version = 5;
  uint64 uptime_s = 6;
  uint64 queue_pending = 7;
  uint64 queue_oldest_age_s = 8;
  optional uint64 last_ack_age_s = 9;
}

message HeartbeatReply {
  uint32 next_in_s = 1;
}

message ListFleetRequest {
  optional string box = 1;
}

message ListFleetReply {
  uint64 as_of_ms = 1;
  repeated BoxView boxes = 2;
}

message BoxView {
  string box = 1;
  string hostname = 2;
  BoxStatus status = 3;
  optional uint64 heartbeat_age_s = 4;
  string boot_id = 5;
  string fleetd_version = 6;
  uint64 queue_pending = 7;
  uint64 queue_oldest_age_s = 8;
  repeated SessionView sessions = 9;
}

enum BoxStatus {
  BOX_STATUS_UNSPECIFIED = 0;
  BOX_STATUS_UNKNOWN = 1;
  BOX_STATUS_LIVE = 2;
  BOX_STATUS_STALE = 3;
  BOX_STATUS_LOST = 4;
}

message SessionView {
  string session_id = 1;
  string kind = 2;
  SessionState state = 3;
  uint64 state_age_s = 4;
  optional string workdir = 5;
  optional string last_prompt = 6;
  optional string last_message = 7;
  uint64 last_event_age_s = 8;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_ACTIVE = 1;
  SESSION_STATE_WORKING = 2;
  SESSION_STATE_IDLE = 3;
  SESSION_STATE_STALLED = 4;
  SESSION_STATE_ENDED = 5;
  SESSION_STATE_CRASHED = 6;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_CANCELLED = 5;
  JOB_STATE_LOST = 6;
}

message Job {
  string job_id = 1;
  string idempotency_key = 2;
  string prompt = 3;
  string repo = 4;
  string base_ref = 5;
  bool open_pr = 6;
  JobState state = 7;
  string box = 8;
  uint32 attempt = 9;
  optional uint64 lease_expires_at_ms = 10;
  string progress = 11;
  optional int32 exit_code = 12;
  optional string branch = 13;
  optional string pr_url = 14;
  optional string error = 15;
  bool cancel_requested = 16;
  uint64 created_at_ms = 17;
  optional uint64 claimed_at_ms = 18;
  optional uint64 finished_at_ms = 19;
  string phase = 20;
}

message SubmitJobRequest {
  string idempotency_key = 1;
  string prompt = 2;
  string repo = 3;
  string base_ref = 4;
  bool open_pr = 5;
}

message GetJobRequest {
  string job_id = 1;
}

message ListJobsRequest {
  optional JobState state = 1;
  uint32 limit = 2;
}

message ListJobsReply {
  repeated Job jobs = 1;
}

message CancelJobRequest {
  string job_id = 1;
}

message TranscriptChunk {
  uint64 seq = 1;
  uint64 ts_ms = 2;
  string text = 3;
  bool truncated = 4;
}

message ReadTranscriptRequest {
  string job_id = 1;
  uint64 after_seq = 2;
  uint32 limit = 3;
}

message ReadTranscriptReply {
  repeated TranscriptChunk chunks = 1;
  bool done = 2;
}

message ClaimJobRequest {
  string box = 1;
}

message ClaimJobReply {
  optional Job job = 1;
  uint32 lease_s = 2;
  uint32 next_in_s = 3;
}

message ReportJobRequest {
  string job_id = 1;
  uint32 attempt = 2;
  string box = 3;
  string phase = 4;
  string progress = 5;
  optional JobState terminal_state = 6;
  optional string pr_url = 7;
  optional string error = 8;
  optional int32 exit_code = 9;
  repeated TranscriptChunk chunks = 10;
  optional string branch = 11;
}

message ReportJobReply {
  uint64 lease_expires_at_ms = 1;
  bool cancel_requested = 2;
  uint64 acked_through_seq = 3;
  bool transcript_truncated = 4;
}
