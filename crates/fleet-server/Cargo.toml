[package]
name = "fleet-server"
description = "Fleet server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[package.metadata.dist]
dist = false

[dependencies]
axum.workspace = true
chacha20poly1305.workspace = true
fleet-core.workspace = true
fleet-proto.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
topcoat = "=0.11.0"
webauthn-rs = "=0.5.5"
hyper-util = { version = "=0.1.21", features = ["tokio", "server-auto", "server-graceful", "service", "http1", "http2"] }
zeroize.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros"] }

[dev-dependencies]
tonic-prost.workspace = true
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }

[lints]
workspace = true
