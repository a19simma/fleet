[package]
name = "fleet-server"
description = "Fleet server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[package.metadata.dist]
dist = false

[dependencies]
axum.workspace = true
chacha20poly1305.workspace = true
fleet-core.workspace = true
fleet-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
topcoat = "=0.11.0"
webauthn-rs = "=0.5.5"
openssl = { version = "0.10", features = ["vendored"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.9"
hyper-util = { version = "=0.1.21", features = ["tokio", "server-auto", "server-graceful", "service", "http1", "http2"] }
zeroize.workspace = true
ring = "0.17.14"
pem = "4.0.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros"] }
argon2 = "0.5.3"

[dev-dependencies]
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }

[lints]
workspace = true
